[tools]
bun = "1.4.3"
node = "24.22.0"

[tasks.install]
description = "Install dependencies from bun.lock"
run = "bun install --frozen-lockfile"

[tasks."lint:biome"]
description = "Check JS, TS, CSS and JSON with Biome"
run = "bunx biome ci ."

[tasks."lint:docs"]
description = "Check Markdown and YAML formatting with oxfmt"
run = "bunx oxfmt --check '**/*.{md,yml,yaml}'"

[tasks.lint]
description = "Run every static check"
depends = ["lint:*"]

[tasks.fix]
description = "Apply safe fixes and format"
run = ["bunx biome check --write .", "bunx oxfmt '**/*.{md,yml,yaml}'"]

[tasks.typecheck]
description = "Type-check .astro and .ts files"
run = "bun run astro check"

[tasks.build]
description = "Build the static site into dist/"
run = "bun run astro build"

[tasks.check]
description = "Run lint, typecheck and build"
depends = ["lint", "typecheck", "build"]

[tasks.dev]
description = "Dev server on port 4321, localhost only"
run = "bun run astro dev"

[tasks."dev:host"]
description = "Dev server on port 4321, reachable from the network"
run = "bun run astro dev --host"

[tasks.preview]
description = "Serve dist/ after a build"
run = "bun run astro preview"
